name: build

# Builds the extension from a clean checkout and keeps the archive.
#
# The WASM in the archive is not readable, so the reviewer of the store needs the
# source and a build that anyone can repeat. This workflow is that proof.

# A change of the documents alone does not need a build, and a tag has its own workflow.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint and format
        run: just check

      - name: Test
        run: just test

      # Also asserts that the archive has nothing that the store rejects.
      - name: Package
        run: just package

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
