name: release

# Builds and publishes when the version of the manifest has no tag yet, which happens
# right after a release pull request is merged.
#
# The trigger is a push to main and not a tag. A tag that a workflow pushes with the
# default token does not start another workflow, so a tag cannot be the entry point here.
# This job makes the tag itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is there a version without a tag?
        id: check
        run: |
          version=$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "リリース済み: ${version}"
            echo "todo=false" >> "${GITHUB_OUTPUT}"
          else
            echo "未リリース: ${version}"
            echo "todo=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: ./.github/actions/setup
        if: steps.check.outputs.todo == 'true'

      - uses: taiki-e/install-action@v2
        if: steps.check.outputs.todo == 'true'
        with:
          tool: git-cliff

      - name: Lint and format
        if: steps.check.outputs.todo == 'true'
        run: just check

      - name: Test
        if: steps.check.outputs.todo == 'true'
        run: just test

      - name: Package
        if: steps.check.outputs.todo == 'true'
        run: just package

      # The archive of a release comes from this build and never from a machine.
      - name: Tag and publish
        if: steps.check.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

          git cliff --current --strip all -o release-notes.md
          # A tag can arrive a second time, for example after a correction of the history,
          # and then the release exists already.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/*.zip --clobber
          else
            gh release create "${VERSION}" dist/*.zip --title "${VERSION}" --notes-file release-notes.md
          fi
      # --- The store, upload only ---
      #
      # The API can also publish, and this does not do it: the listing (screenshots,
      # category, the privacy answers) is not in the API, so a human looks at the draft in
      # the dashboard and presses the button there.
      #
      # Without the secrets this step does nothing, so a fork and a checkout without them
      # still release to GitHub.
      - name: Upload to the Chrome Web Store
        if: steps.check.outputs.todo == 'true' && env.EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # `jq` and not python: a heredoc inside this block would carry the indentation of
          # the YAML into the code.
          #
          # The refresh token lives on; an access token is for this run only.
          token=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | jq -r '.access_token // empty')
          if [ -z "${token}" ]; then
            echo "::error::アクセストークンが取れません（Secrets を確認してください）"
            exit 1
          fi

          reply=$(curl -sS -X PUT \
            -H "Authorization: Bearer ${token}" \
            -H "x-goog-api-version: 2" \
            -T "dist/d-tweaks-${VERSION}.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}?uploadType=media")
          echo "${reply}" | jq .

          # SUCCESS and IN_PROGRESS are both fine; a FAILURE names the reason
          state=$(echo "${reply}" | jq -r '.uploadState // empty')
          if [ "${state}" = "FAILURE" ]; then
            echo "${reply}" | jq -r '.itemError[]? | "::error::\(.error_detail)"'
            exit 1
          fi
          echo "uploadState = ${state}"

          {
            echo "### ストアに下書きを上げました（${VERSION}）"
            echo
            echo "公開はダッシュボードのボタンです。掲載情報を見てから出してください。"
          } >> "${GITHUB_STEP_SUMMARY}"
