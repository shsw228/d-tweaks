name: release

# A tag starts a release. `just release <version>` writes the version into
# `extension/manifest.json`, commits, and makes the tag, so the tag is only a mark on a
# commit that already has the correct version. The first step here proves that.

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag and the manifest must agree
        run: |
          version=$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')
          echo "tag=${GITHUB_REF_NAME} manifest=${version}"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "タグ名と manifest.json の version が違います" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup

      - name: Lint and format
        run: just check

      - name: Test
        run: just test

      - name: Package
        run: just package

      # The archive of a release must be the one that the store receives, so it comes
      # from this build and not from a machine.
      # A tag can arrive a second time, for example after a correction of the history, and
      # then the release exists already. `gh release create` fails on that, so the step
      # replaces the archive instead.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/*.zip --clobber
          else
            gh release create "${tag}" dist/*.zip --title "${tag}" --generate-notes
          fi
