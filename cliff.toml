# git-cliff: makes the changelog and decides the next version.
#
# One line of the changelog is one commit. Keep a subject on one line and put the detail
# in the pull request: the subject is what a reader of the changelog gets.
#
# The repository merges a pull request with a merge commit, so the commits of the branch
# stay in the history. That keeps the version bump exact: it comes from the kinds of the
# real commits and not from the title of the pull request.
#
# # The subjects become conventional commits before anything reads them
#
# Only a change that reaches the archive makes a release. `[chore]`, `[docs]`, `[build]`
# and `[ci]` are skipped, so a run of them alone computes the same version and no release
# pull request appears. A `CHANGELOG.md` that is written again therefore holds only the
# releases and what was in them; the commits stay in the history of git.
#
# The subjects are `[kind] text` in Japanese. `commit_preprocessors` turns `[feat]` into
# `feat:` and so on, and `conventional_commits = true` reads that form.
#
# The first version of this file did the opposite: it kept `conventional_commits = false`
# and gave the parsers the `[kind]` form directly. The groups were correct, but **every
# release was a patch**, also with a feature in it (measured: a range with one `[feat]`
# gave 1.0.1 and not 1.1.0). Without the conventional form git-cliff has no type to
# decide a bump with, and `custom_minor_increment_regex` did not help.
#
# A useful effect: with the conventional form, `commit.message` is the text without the
# `[kind]`, so the template needs no split.

[changelog]
# The body of one version ends with an empty line and `trim` is off, so the last item of
# a version and the heading of the version below it do not touch. Without that line, a
# renderer reads the heading as a part of the last item.
#
# The empty line is at the end and not at the start, because the body is also the text of
# the release and of the release pull request. A line at the start would put an empty line
# over both of them.
header = "# Changelog\n"
body = """{% if version %}## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = "^\\[feat!\\]", replace = "feat!:" },
  { pattern = "^\\[feat\\]", replace = "feat:" },
  { pattern = "^\\[fix\\]", replace = "fix:" },
  { pattern = "^\\[perf\\]", replace = "perf:" },
  { pattern = "^\\[refactor\\]", replace = "refactor:" },
  { pattern = "^\\[docs\\]", replace = "docs:" },
  { pattern = "^\\[style\\]", replace = "style:" },
  { pattern = "^\\[test\\]", replace = "test:" },
  { pattern = "^\\[build\\]", replace = "build:" },
  { pattern = "^\\[ci\\]", replace = "ci:" },
  { pattern = "^\\[chore\\]", replace = "chore:" },
]
# The order decides the group, so the first match wins.
commit_parsers = [
  { message = "^Merge (pull request|branch|remote)", skip = true },
  { message = "^feat", group = "✨ Features" },
  { message = "^fix", group = "🐛 Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^style", group = "💄 Style" },
  { message = "^test", group = "✅ Tests" },
  # These do not reach the archive, so they do not make a release of their own.
  #
  # `skip` also keeps them out of the changelog. That is the point: the changelog is the
  # note of a release, and a release exists only when what the user installs has changed.
  # The commits themselves stay in the history of git.
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^build|^ci", skip = true },
  { message = ".*", group = "📦 Other" },
]
tag_pattern = "[0-9]*"
sort_commits = "oldest"

[bump]
# `[feat]` gives a minor and `[feat!]` (or `BREAKING CHANGE` in the body) gives a major,
# also below 1.0. Everything else gives a patch.
features_always_bump_minor = true
breaking_always_bump_major = true
