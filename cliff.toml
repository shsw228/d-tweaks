# git-cliff: makes the changelog and decides the next version.
#
# One line of the changelog is one commit. The subjects are `[kind] text` in Japanese and
# not conventional commits, so the parsers below read that form. Keep a subject on one
# line and put the detail in the pull request: the subject is what a reader of the
# changelog gets.
#
# The repository merges a pull request with a merge commit, so the commits of the branch
# stay in the history. That keeps the version bump exact: it comes from the kinds of the
# real commits and not from the title of the pull request.

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | split(pat="] ") | last | trim }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
# The order decides the group, so the first match wins.
commit_parsers = [
  # A merge commit says nothing that its commits do not say already.
  { message = "^Merge (pull request|branch|remote)", skip = true },
  { message = "^\\[feat!?\\]", group = "✨ Features" },
  { message = "^\\[fix\\]", group = "🐛 Fixes" },
  { message = "^\\[perf\\]", group = "⚡ Performance" },
  { message = "^\\[refactor\\]", group = "♻️ Refactoring" },
  { message = "^\\[docs\\]", group = "📝 Documentation" },
  { message = "^\\[style\\]", group = "💄 Style" },
  { message = "^\\[test\\]", group = "✅ Tests" },
  { message = "^\\[build\\]|^\\[ci\\]", group = "🔧 Build and CI" },
  { message = "^\\[chore\\]", skip = true },
  { message = ".*", group = "📦 Other" },
]
tag_pattern = "[0-9]*"
sort_commits = "oldest"

[bump]
# major only with an explicit mark, minor for a feature, patch for everything else.
custom_major_increment_regex = "^\\[feat!\\]|BREAKING CHANGE"
custom_minor_increment_regex = "^\\[feat\\]"
