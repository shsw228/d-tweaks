[workspace]
members = ["crates/shared", "crates/core", "crates/background", "crates/options"]
resolver = "3"

[workspace.package]
# extension/manifest.json の version と同じ値にする（`just release` が両方を書き換える）
version = "1.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/shsw228/d-tweaks"

[workspace.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# WASM は毎ページロードで instantiate されるので、サイズ最優先で絞る
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
